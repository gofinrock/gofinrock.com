<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in — Finrock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--hair-2); border-radius: 20px;
    padding: 40px; box-shadow: 0 24px 60px rgba(15,17,23,0.08);
  }
  .auth-card h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 18px 0 6px; }
  .auth-card .sub { color: var(--text-3); margin-bottom: 28px; font-size: 14px; }
  .auth-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-2); }
  .auth-card input {
    width: 100%; height: 48px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--hair-2); background: var(--bg);
    font-size: 14px; font-family: inherit; margin-bottom: 16px;
  }
  .auth-card input:focus { outline: none; border-color: var(--navy); }
  .auth-card .btn { width: 100%; justify-content: center; padding: 14px; }
  .auth-card .divider { display: flex; align-items: center; gap: 14px; margin: 24px 0; color: var(--text-3); font-size: 12px; }
  .auth-card .divider::before, .auth-card .divider::after { content: ''; flex: 1; height: 1px; background: var(--hair-2); }
  .auth-card .sso { display: flex; flex-direction: column; gap: 10px; }
  .auth-card .sso .btn { background: var(--bg); }
  .auth-card .foot { text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-3); }
  .auth-card .foot a { color: var(--navy); font-weight: 600; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand"><span class="brand-mark"></span><span>Finrock</span></a>
    <h1>Welcome back.</h1>
    <p class="sub">Sign in to your Life OS.</p>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="••••••••" />
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <div class="divider">or continue with</div>
    <div class="sso">
      <button class="btn btn-secondary">Continue with Google</button>
      <button class="btn btn-secondary">Continue with Apple</button>
      <button class="btn btn-secondary">Magic link by email</button>
    </div>
    <p class="foot">New here? <a href="signup.html">Create an account →</a></p>
    <p class="foot" style="margin-top: 8px;"><a href="forgot.html">Forgot password?</a></p>
  </div>
</div>
</body>
</html>
